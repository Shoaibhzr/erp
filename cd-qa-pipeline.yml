trigger:
  branches:
    include:
      - dev

pool:
  vmImage: ubuntu-latest

steps:
  - task: Npm@1
    displayName: 'Install dependencies'
    inputs:
      command: 'custom'
      workingDir: '$(System.DefaultWorkingDirectory)'
      customCommand: 'install --force'
  - task: Npm@1
    displayName: 'Build'
    inputs:
      command: 'custom'
      workingDir: '$(System.DefaultWorkingDirectory)'
      customCommand: 'run qa'
  - task: AzureStaticWebApp@0
    displayName: 'Deploy'
    inputs:
      app_location: '/dist/app.web'
      workingDirectory: '$(System.DefaultWorkingDirectory)'
      skip_app_build: true
      skip_api_build: true
      is_static_export: false
      azure_static_web_apps_api_token: 'e455c0f2b64d0bf45c56770001afb2ce8481bf5b209a520ad4ba13969103077f5-7dc54190-faf6-42c2-afd7-a743b9af2176010586517'
