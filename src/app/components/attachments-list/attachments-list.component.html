<div class="modal-header">

  <h5 class="modal-title">

    Attachments

  </h5>

  <button type="button" class="btn-close" (click)="close()"></button>

</div>

<div class="modal-body">

  <ng-container *ngIf="!files || files.length === 0" class="p-2">

    <h6>

      No Files Were Found.

    </h6>

  </ng-container>

  <ng-container *ngIf="files && files.length > 0">

    <div class="list-group">

      <div *ngFor="let file of files; let last = last;"
           class="list-group-item border-0 d-flex align-items-center justify-content-between"
           [class.border-bottom]="!last">

        <div class="d-flex align-items-center">

          <i class="ri-file-info-line fs-3" style="color: #1C274C;"></i>

          <!-- <img [src]="" class="file-icon">-->

          <span class="ms-2">{{ file.name }}</span>

        </div>

        <div class="d-flex">

          <button class="btn btn-link text-dark m-0 p-0 mx-2" (click)="viewFile(file)">

            <i class="ri-eye-line"></i>

          </button>

          <button class="btn btn-link text-dark m-0 p-0" (click)="downloadFile(file)">

            <i class="ri-download-2-line" style="color: #1C274C;"></i>

            <ng-container *ngIf="isHttpRequestInProgress">

              <span class="spinner-border flex-shrink-0 ms-2" role="status">

                <span class="visually-hidden">Loading...</span>

              </span>

            </ng-container>

          </button>

        </div>

      </div>

    </div>

  </ng-container>

</div>
