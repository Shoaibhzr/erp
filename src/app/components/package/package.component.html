<div class="p-0 m-0">

    <!-- <div class="bg-overlay"></div> -->

    <div class="overflow-hidden">

        <div class="main-container">

            <div class="row">

                <div class="col-lg-12 h-100">

                    <div class="row g-0 page-h">
                        <div class="col-lg-12">
                            <div class="text-center mb-5">
                                <img src="../../../assets/logo/new-logo.png" alt="">
                            </div>
                            <div class="text-center">
                                <h5 class="welcome-text">Select Package</h5>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div *ngIf="islogin" class="p-4 flex-column justify-content-center align-items-center">
                                <div class="login-container">


                                    <ng-container *ngIf="form">

                                        <div class="mt-4">

                                            <div class="mb-3">

                                                <label for="username" class="form-label">
                                                    Package Name <span class="text-danger"></span>
                                                </label>
                                                <button class="btn login-btn w-100 btn-load"
                                                    [disabled]="!form.valid || isLoginInProgress" type="submit">

                                                    <div class="d-flex align-items-center justify-content-center">

                                                        Select

                                                        <ng-container *ngIf="isLoginInProgress">

                                                            <span class="spinner-border flex-shrink-0 ms-2"
                                                                role="status">

                                                                <span class="visually-hidden">Loading...</span>

                                                            </span>

                                                        </ng-container>

                                                    </div>

                                                </button>
                                            </div>

                                        </div>

                                        <span *ngIf="loginError" class="error-message"
                                            style="display: flex; justify-content: center;">
                                            Select any package.
                                        </span>

                                    </ng-container>
                                    <div class="mt-3 text-center">

                                        <p class="account-text">Need help with your account? <a
                                                href="https://mealdynamics.com/contact/"
                                                class="fw-semibold text-primary text-decoration-underline"> Contact
                                                Us</a> </p>

                                    </div>
                                </div>
                            </div>

                            <div *ngIf="!islogin && !isOTP && !isNewPassword"
                                class="p-lg-5 p-4 d-flex flex-column justify-content-center align-items-center min-vh-100">
                                <div class="login-container">
                                    <div *ngIf="isLoginInProgress" class="overlay">
                                        <div class="spinner-container">
                                            <span role="status" class="spinner-border"><span
                                                    class="visually-hidden">Loading...</span></span>
                                        </div>
                                    </div>

                                    <div class="text-center mb-5">
                                        <img src="../../../assets/logo/new-logo.png" alt="">
                                    </div>
                                </div>
                            </div>
                            <div class="footer text-start mx-4">
                                <p class="mb-0 small">
                                    ©
                                    <a href="https://mealdynamics.com" target="_blank">Meal Dynamics 2025</a>
                                </p>
                            </div>


                        </div>



                    </div>


                </div>



            </div>

        </div>

    </div>
</div>
